services:
  postgres:
    image: postgres:15
    container_name: crypto_db
    hostname: postgres # ⬅️ Definir hostname explicitamente
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    networks:
      - crypto-network

  jupyter:
    build: .
    container_name: jupyter_lab
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_PORT: 5432
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    networks:
      - crypto-network

volumes:
  postgres_data:

networks:
  crypto-network:
    driver: bridge
    name: crypto-network # ⬅️ Nome explícito
